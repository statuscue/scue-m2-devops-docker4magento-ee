version: "3.8"

services:
  mysql:
    image: mysql:$MYSQL_TAG
    container_name: "${PROJECT_NAME}_mysql"
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: $DB_ROOT_PASSWORD
      MYSQL_DATABASE: $DB_NAME
      MYSQL_USER: $DB_USER
      MYSQL_PASSWORD: $DB_PASSWORD
    # ports:
      # - '33061:3306'
    # volumes:
      # - ./.initdb:/custom-entrypoint-initdb.d # custom directory for importing *.sql files
      # - ./db:/var/lib/mysql # I want to manage volumes manually.

  php:
    image: scue/php:$PHP_TAG
    container_name: "${PROJECT_NAME}_php"
    environment:
      # PHP_SENDMAIL_PATH: /usr/sbin/sendmail -t -i -S mailhog:1025
      PHP_IDE_CONFIG: serverName=phpstorm
      # XDEBUG_MODE: "debug" # https://xdebug.org/docs/all_settings#mode
      # XDEBUG_IDEKEY: "PHPSTORM"
      # XDEBUG_CLIENT_DISCOVERY_HEADER:
      # XDEBUG_CLIENT_HOST: 172.17.0.1 # Linux
      # XDEBUG_CLIENT_PORT: 9003
      # XDEBUG_COLLECT_ASSIGNMENTS: 0
      # XDEBUG_COLLECT_RETURN: 0
      # XDEBUG_DISCOVER_CLIENT_HOST: 0 # Replacement for `xdebug.remote_connect_back`
      # XDEBUG_DUMP_GLOBALS: 1
      # XDEBUG_DUMP_ONCE: 1
      # XDEBUG_DUMP_UNDEFINED: 0
      # XDEBUG_FILE_LINK_FORMAT: http://localhost:8091/?message=%f:%l
      # XDEBUG_FORCE_DISPLAY_ERRORS: 0
      # XDEBUG_FORCE_ERROR_REPORTING: 0
      # XDEBUG_HALT_LEVEL: 0
      # XDEBUG_LOG:
      # XDEBUG_LOG_LEVEL: 7
      # XDEBUG_MAX_NESTING_LEVEL: 512
      # XDEBUG_MAX_STACK_FRAMES: -1
      # XDEBUG_PROFILER_AGGREGATE: 0
      # XDEBUG_PROFILER_APPEND: 0
      # XDEBUG_PROFILER_OUTPUT_NAME: cachegrind.out.%p
      # XDEBUG_SCREAM: 0
      # XDEBUG_SHOW_ERROR_TRACE: 0
      # XDEBUG_SHOW_EXCEPTION_TRACE: 0
      # XDEBUG_SHOW_LOCAL_VARS: 0
      # XDEBUG_START_WITH_REQUEST: default
      # XDEBUG_TRACE_FORMAT: 0
      # XDEBUG_TRACE_OPTIONS: 0
      # XDEBUG_TRACE_OUTPUT_NAME: trace.%c
      # XDEBUG_TRIGGER_VALUE:
      # XDEBUG_VAR_DISPLAY_MAX_CHILDREN: 128
      # XDEBUG_VAR_DISPLAY_MAX_DATA: 512
      # XDEBUG_VAR_DISPLAY_MAX_DEPTH: 3
    volumes:
      - .:/var/www/html:cached
      - ./.files:/mnt/files

  nginx:
    image: scue/nginx:$NGINX_TAG
    container_name: "${PROJECT_NAME}_nginx"
    depends_on:
      - php
    volumes:
      - .:/var/www/html:cached
    labels:
      - "traefik.http.routers.${PROJECT_NAME}_nginx.rule=Host(`${PROJECT_BASE_URL}`)"

  elasticsearch:
    image: elasticsearch:$ELASTICSEARCH_TAG
    container_name: "${PROJECT_NAME}_elasticsearch"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1

  redis:
    image: redis:6.2.5-alpine
    container_name: "${PROJECT_NAME}_redis"

  traefik:
    image: traefik:v2.0
    container_name: "${PROJECT_NAME}_traefik"
    command: --api.insecure=true --providers.docker
    ports:
      - '${PROJECT_BASE_PORT}:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
